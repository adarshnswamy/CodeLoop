<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeLoop | Professional AI Programming Workspace</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            },
            app: {
              bg: '#09090b',
              surface: '#121215',
              surfaceRaised: '#18181b',
              border: '#27272a',
              borderSubtle: '#1f1f23',
              text: '#f4f4f5',
              muted: '#a1a1aa',
              dim: '#71717a',
              primary: '#2563eb',
              primaryHover: '#1d4ed8',
              success: '#10b981',
              danger: '#ef4444',
              warning: '#f59e0b',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Monaco Editor Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

  <!-- Marked for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- PrismJS Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

  <!-- Pyodide WebAssembly for Zero-Latency In-Browser Python Execution -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js" defer></script>

  <style>
    /* Clean High-Contrast Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #3f3f46;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }

    /* Design System Tokens */
    .theme-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      color: #0f172a;
    }
    .dark .theme-card {
      background-color: #121215;
      border: 1px solid #27272a;
      color: #f4f4f5;
    }

    .theme-card-subtle {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #1e293b;
    }
    .dark .theme-card-subtle {
      background-color: #18181b;
      border: 1px solid #27272a;
      color: #f4f4f5;
    }

    .theme-input {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }
    .dark .theme-input {
      background-color: #18181b;
      border: 1px solid #27272a;
      color: #f4f4f5;
    }
    .theme-input::placeholder {
      color: #94a3b8;
    }
    .dark .theme-input::placeholder {
      color: #52525b;
    }

    /* Markdown High-Contrast Dark Styling */
    .prose-dark {
      color: #e4e4e7;
      line-height: 1.7;
      font-size: 0.925rem;
    }
    .prose-dark h1, .prose-dark h2, .prose-dark h3, .prose-dark h4 {
      color: #fafafa;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    .prose-dark h1 { font-size: 1.35rem; }
    .prose-dark h2 { font-size: 1.18rem; }
    .prose-dark h3 { font-size: 1.05rem; }
    .prose-dark p {
      margin-bottom: 0.85rem;
    }
    .prose-dark ul {
      margin-left: 1.4rem;
      margin-bottom: 0.85rem;
      list-style-type: disc;
    }
    .prose-dark ol {
      margin-left: 1.4rem;
      margin-bottom: 0.85rem;
      list-style-type: decimal;
    }
    .prose-dark li {
      margin-bottom: 0.35rem;
      padding-left: 0.25rem;
    }
    .prose-dark code {
      background: #18181b;
      color: #f4f4f5;
      border: 1px solid #27272a;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
    }
    .prose-dark blockquote {
      border-left: 3px solid #3b82f6;
      background: #141418;
      padding: 0.5rem 0.85rem;
      border-radius: 0 4px 4px 0;
      color: #d4d4d8;
      margin: 0.85rem 0;
    }
    .prose-dark a {
      color: #3b82f6;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .prose-dark a:hover {
      color: #60a5fa;
    }
    .prose-dark table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.85rem 0;
      font-size: 0.85rem;
    }
    .prose-dark th {
      padding: 0.5rem 0.75rem;
      font-weight: 600;
      text-align: left;
      background: #18181b;
      border-bottom: 2px solid #27272a;
      color: #f4f4f5;
    }
    .prose-dark td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #27272a;
      color: #d4d4d8;
    }
    .prose-dark tr:hover td {
      background: rgba(39, 39, 42, 0.4);
    }

    /* Light mode markdown */
    .prose-light {
      color: #1e293b;
      line-height: 1.7;
      font-size: 0.925rem;
    }
    .prose-light h1, .prose-light h2, .prose-light h3, .prose-light h4 {
      color: #0f172a;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    .prose-light h1 { font-size: 1.35rem; }
    .prose-light h2 { font-size: 1.18rem; }
    .prose-light h3 { font-size: 1.05rem; }
    .prose-light p {
      margin-bottom: 0.85rem;
    }
    .prose-light ul {
      margin-left: 1.4rem;
      margin-bottom: 0.85rem;
      list-style-type: disc;
    }
    .prose-light ol {
      margin-left: 1.4rem;
      margin-bottom: 0.85rem;
      list-style-type: decimal;
    }
    .prose-light li {
      margin-bottom: 0.35rem;
      padding-left: 0.25rem;
    }
    .prose-light code {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
    }
    .prose-light blockquote {
      border-left: 3px solid #2563eb;
      background: #f8fafc;
      padding: 0.5rem 0.85rem;
      border-radius: 0 4px 4px 0;
      color: #475569;
      margin: 0.85rem 0;
    }
    .prose-light a {
      color: #2563eb;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .prose-light a:hover {
      color: #1d4ed8;
    }
    .prose-light table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.85rem 0;
      font-size: 0.85rem;
    }
    .prose-light th {
      padding: 0.5rem 0.75rem;
      font-weight: 600;
      text-align: left;
      background: #f1f5f9;
      border-bottom: 2px solid #e2e8f0;
      color: #0f172a;
    }
    .prose-light td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #e2e8f0;
      color: #334155;
    }
    .prose-light tr:hover td {
      background: rgba(241, 245, 249, 0.6);
    }

    /* Code block styling overrides */
    .code-block-wrapper pre {
      background: transparent !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .code-block-wrapper pre code {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      font-size: 12.5px !important;
      line-height: 1.65 !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-[#0f172a] dark:bg-[#09090b] dark:text-[#f4f4f5] font-sans antialiased min-h-screen">
  <div id="root"></div>

  <!-- Monaco loader configuration -->
  <script>
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
    window.MonacoLoaded = new Promise((resolve) => {
      require(['vs/editor/editor.main'], function () {
        resolve(window.monaco);
      });
    });
  </script>

  <!-- Main Application Script -->
  <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
