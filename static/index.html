<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODELOOP — Learn. Code. Build. Repeat.</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233B82F6'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  
  <!-- Inter & JetBrains Mono Fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            main: '#090B10',
            secondary: '#0E1118',
            card: '#11151D',
            elevated: '#1B2230',
            primary: {
              DEFAULT: '#3B82F6',
              hover: '#2563EB',
              muted: '#1D4ED8',
              surface: 'rgba(59, 130, 246, 0.1)',
              border: 'rgba(59, 130, 246, 0.25)',
            },
            accent: {
              DEFAULT: '#8B5CF6',
              hover: '#7C3AED',
              surface: 'rgba(139, 92, 246, 0.1)',
            },
            subtle: '#94A3B8',
            surfaceText: '#F1F5F9',
            darkBorder: '#1E293B',
            darkBorderElevated: '#283347',
            status: {
              success: '#10B981',
              warning: '#F59E0B',
              error: '#EF4444',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Monaco Editor Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

  <!-- Marked for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- PrismJS Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

  <!-- Pyodide WebAssembly for Zero-Latency In-Browser Python Execution -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js" defer></script>

  <style>
    /* Strict Dark Theme Base */
    html, body {
      background-color: #090B10;
      color: #F1F5F9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Minimalist High-Precision Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #283347;
    }

    /* Selection Highlighting */
    ::selection {
      background-color: rgba(59, 130, 246, 0.3);
      color: #FFFFFF;
    }

    /* Design System Card & Surface Utility Classes */
    .cd-card {
      background-color: #11151D;
      border: 1px solid #1E293B;
      border-radius: 0.75rem;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .cd-card:hover {
      border-color: #283347;
    }
    .cd-card-interactive:hover {
      border-color: rgba(59, 130, 246, 0.4);
      background-color: #141923;
    }

    .cd-elevated {
      background-color: #1B2230;
      border: 1px solid #283347;
      border-radius: 0.75rem;
    }

    .cd-input {
      background-color: #0E1118;
      border: 1px solid #1E293B;
      color: #F1F5F9;
      transition: all 0.15s ease;
    }
    .cd-input:focus {
      outline: none;
      border-color: #3B82F6;
      box-shadow: 0 0 0 1px #3B82F6;
    }
    .cd-input::placeholder {
      color: #64748B;
    }

    /* Markdown Styling in AI Tutor & Explanations */
    .prose-dark {
      color: #E2E8F0;
      line-height: 1.68;
      font-size: 0.915rem;
    }
    .prose-dark h1, .prose-dark h2, .prose-dark h3, .prose-dark h4 {
      color: #F8FAFC;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.45rem;
      letter-spacing: -0.015em;
    }
    .prose-dark h1 { font-size: 1.3rem; }
    .prose-dark h2 { font-size: 1.15rem; }
    .prose-dark h3 { font-size: 1.025rem; }
    .prose-dark p {
      margin-bottom: 0.75rem;
    }
    .prose-dark ul {
      margin-left: 1.25rem;
      margin-bottom: 0.75rem;
      list-style-type: disc;
    }
    .prose-dark ol {
      margin-left: 1.25rem;
      margin-bottom: 0.75rem;
      list-style-type: decimal;
    }
    .prose-dark li {
      margin-bottom: 0.3rem;
      padding-left: 0.2rem;
    }
    .prose-dark strong {
      color: #F8FAFC;
      font-weight: 600;
    }
    .prose-dark code {
      background: #1B2230;
      color: #93C5FD;
      border: 1px solid #283347;
      padding: 0.12rem 0.35rem;
      border-radius: 0.25rem;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.84em;
    }
    .prose-dark blockquote {
      border-left: 3px solid #3B82F6;
      background: #0E1118;
      padding: 0.5rem 0.85rem;
      border-radius: 0 4px 4px 0;
      color: #CBD5E1;
      margin: 0.75rem 0;
    }
    .prose-dark a {
      color: #3B82F6;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .prose-dark a:hover {
      color: #60A5FA;
    }

    /* Prism Syntax Highlight Code Blocks */
    .code-block-wrapper pre {
      background: transparent !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .code-block-wrapper pre code {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      font-size: 12.5px !important;
      line-height: 1.65 !important;
      font-family: 'JetBrains Mono', ui-monospace, monospace !important;
    }

    /* Pulse animation for running execution */
    @keyframes subtlePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-subtle-pulse {
      animation: subtlePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-[#090B10] text-[#F1F5F9] font-sans antialiased min-h-screen">
  <div id="root"></div>

  <!-- Monaco loader configuration -->
  <script>
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
    window.MonacoLoaded = new Promise((resolve) => {
      require(['vs/editor/editor.main'], function () {
        // Define Custom CodeLoop Dark Monaco Theme
        if (window.monaco) {
          window.monaco.editor.defineTheme('codeloop-dark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
              { token: '', background: '0E1118', foreground: 'E2E8F0' },
              { token: 'comment', foreground: '64748B', fontStyle: 'italic' },
              { token: 'keyword', foreground: '3B82F6', fontStyle: 'bold' },
              { token: 'string', foreground: '10B981' },
              { token: 'number', foreground: 'F59E0B' },
              { token: 'type', foreground: '8B5CF6' },
              { token: 'function', foreground: '60A5FA' }
            ],
            colors: {
              'editor.background': '#0E1118',
              'editor.foreground': '#F1F5F9',
              'editorLineNumber.foreground': '#475569',
              'editorLineNumber.activeForeground': '#94A3B8',
              'editor.lineHighlightBackground': '#141923',
              'editorCursor.foreground': '#3B82F6',
              'editor.selectionBackground': '#1E293B',
              'editorIndentGuide.background': '#1E293B',
              'editorIndentGuide.activeBackground': '#334155'
            }
          });
        }
        resolve(window.monaco);
      });
    });
  </script>

  <!-- Main Application Script -->
  <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
