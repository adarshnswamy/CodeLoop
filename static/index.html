<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeLoop | Programming Workspace</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            app: {
              bg: '#09090b',
              surface: '#121215',
              surfaceRaised: '#18181b',
              border: '#27272a',
              borderSubtle: '#1f1f23',
              text: '#f4f4f5',
              muted: '#a1a1aa',
              dim: '#71717a',
              primary: '#2563eb',
              primaryHover: '#1d4ed8',
              success: '#10b981',
              danger: '#ef4444',
              warning: '#f59e0b',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Monaco Editor Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

  <!-- Marked for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* Sharp High-Contrast Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    .dark ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }

    /* Markdown High-Contrast Dark Styling */
    .prose-dark {
      color: #e4e4e7;
      line-height: 1.6;
      font-size: 0.875rem;
    }
    .prose-dark h1, .prose-dark h2, .prose-dark h3, .prose-dark h4 {
      color: #fafafa;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.35rem;
      letter-spacing: -0.01em;
    }
    .prose-dark p {
      margin-bottom: 0.65rem;
    }
    .prose-dark ul, .prose-dark ol {
      margin-left: 1.25rem;
      margin-bottom: 0.65rem;
    }
    .prose-dark li {
      margin-bottom: 0.2rem;
      list-style-type: disc;
    }
    .prose-dark code {
      background: #18181b;
      color: #e4e4e7;
      border: 1px solid #27272a;
      padding: 0.1rem 0.3rem;
      border-radius: 0.2rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.825em;
    }
    .prose-dark pre {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 0.375rem;
      padding: 0.75rem;
      overflow-x: auto;
      margin-bottom: 0.75rem;
    }
    .prose-dark pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #f4f4f5;
    }
    .prose-dark blockquote {
      border-left: 2px solid #3f3f46;
      padding-left: 0.75rem;
      color: #a1a1aa;
      margin-bottom: 0.65rem;
    }

    /* Light mode markdown */
    .prose-light {
      color: #18181b;
      line-height: 1.6;
      font-size: 0.875rem;
    }
    .prose-light h1, .prose-light h2, .prose-light h3, .prose-light h4 {
      color: #09090b;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.35rem;
    }
    .prose-light p {
      margin-bottom: 0.65rem;
    }
    .prose-light ul {
      margin-left: 1.25rem;
      margin-bottom: 0.65rem;
      list-style-type: disc;
    }
    .prose-light code {
      background: #f4f4f5;
      color: #09090b;
      border: 1px solid #e4e4e7;
      padding: 0.1rem 0.3rem;
      border-radius: 0.2rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.825em;
    }
    .prose-light pre {
      background: #fafafa;
      border: 1px solid #e4e4e7;
      border-radius: 0.375rem;
      padding: 0.75rem;
      overflow-x: auto;
      margin-bottom: 0.75rem;
    }
    .prose-light pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #18181b;
    }
    .prose-light blockquote {
      border-left: 2px solid #d4d4d8;
      padding-left: 0.75rem;
      color: #52525b;
      margin-bottom: 0.65rem;
    }
  </style>
</head>
<body class="bg-[#09090b] text-[#f4f4f5] font-sans antialiased min-h-screen">
  <div id="root"></div>

  <!-- Monaco loader configuration -->
  <script>
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
    window.MonacoLoaded = new Promise((resolve) => {
      require(['vs/editor/editor.main'], function () {
        resolve(window.monaco);
      });
    });
  </script>

  <!-- Main Application Script -->
  <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
